spring:
  datasource:
    url: jdbc:h2:mem:orchedule;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration


  h2:
    console:
      enabled: false

  security:
    jwt:
      secret: test-test-test-test-test-test-test-test-test-test-test-test-test-test
      access-token-expiration-seconds: 900
      refresh-token-expiration-seconds: 2592000